# NeuraLearn on Netlify — static UI + serverless API (production)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # One function (netlify/functions/api.mjs) serves every /api/* route with the
  # same handler as server.mjs; its path is set in the file, so no redirects.
  # Netlify stops functions after 60 s. Model calls stop trying new models
  # before then (NL_TIME_LIMIT_MS, default 55000) and return a clear error.

[[headers]]
  for = "/*"
  [headers.values]
    x-content-type-options = "nosniff"
    x-frame-options = "DENY"
    referrer-policy = "no-referrer"
    permissions-policy = "microphone=(), camera=(), geolocation=()"
    content-security-policy = "default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' blob:; frame-ancestors 'none'"
